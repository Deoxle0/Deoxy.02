<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Chatbot | Gemini Powered</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .api-section {
            background: #f0f0f0;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-section input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .api-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .api-section button:hover {
            background: #764ba2;
        }

        .status {
            font-size: 12px;
            padding: 5px 15px;
            background: #e8e8e8;
            color: #666;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
        }

        .assistant .message-avatar {
            background: #667eea;
            color: white;
        }

        .user .message-avatar {
            background: #764ba2;
            color: white;
            order: 2;
        }

        .typing-indicator {
            display: none;
            padding: 10px 20px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 15px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input-container input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-container input:focus {
            border-color: #667eea;
        }

        .chat-input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .chat-input-container button:hover {
            transform: scale(1.05);
        }

        .chat-input-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #ff6b6b !important;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 85%;
            }
            .api-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Free AI Chatbot</h1>
            <p>Powered by Google Gemini (Free API)</p>
        </div>
        
        <div class="api-section">
            <input type="text" id="apiKey" placeholder="Enter your Gemini API Key" value="">
            <button onclick="saveApiKey()">Save API Key</button>
            <button onclick="clearChat()" class="clear-btn">Clear Chat</button>
        </div>
        
        <div class="status" id="status">⚡ Status: Ready - Enter your API key to start</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-avatar">🤖</div>
                <div class="message-content">Hi! I'm your AI assistant. Please enter your Gemini API key above to start chatting. Get one for free at <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a></div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <div class="chat-input-container">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('gemini_api_key') || '';
        let conversationHistory = [];
        
        // Load saved API key on startup
        if(API_KEY) {
            document.getElementById('apiKey').value = API_KEY;
            updateStatus('✅ API Key loaded - Ready to chat!');
        }
        
        function saveApiKey() {
            API_KEY = document.getElementById('apiKey').value.trim();
            if(API_KEY) {
                localStorage.setItem('gemini_api_key', API_KEY);
                updateStatus('✅ API Key saved! You can now start chatting.');
                addSystemMessage('API Key saved! Start chatting with the AI.');
            } else {
                updateStatus('⚠️ Please enter a valid API key', 'error');
            }
        }
        
        function updateStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.style.background = type === 'error' ? '#ffebee' : '#e8f5e9';
            statusDiv.style.color = type === 'error' ? '#c62828' : '#2e7d32';
            setTimeout(() => {
                if(statusDiv.textContent === message) {
                    statusDiv.style.background = '#e8e8e8';
                    statusDiv.style.color = '#666';
                }
            }, 3000);
        }
        
        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addMessage(message, isUser) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content">${escapeHtml(message)}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if(!message) return;
            
            if(!API_KEY) {
                updateStatus('❌ Please enter your API key first!', 'error');
                return;
            }
            
            // Disable input while processing
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            userInput.disabled = true;
            
            // Add user message to chat
            addMessage(message, true);
            userInput.value = '';
            
            // Show typing indicator
            const typingIndicator = document.getElementById('typingIndicator');
            typingIndicator.style.display = 'block';
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            
            try {
                // Prepare conversation history for Gemini
                const geminiHistory = conversationHistory.map(msg => ({
                    role: msg.role,
                    parts: [{ text: msg.content }]
                }));
                
                // Add current message
                geminiHistory.push({
                    role: "user",
                    parts: [{ text: message }]
                });
                
                // Call Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: geminiHistory,
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 1000,
                        }
                    })
                });
                
                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.style.display = 'none';
                
                if(response.ok && data.candidates && data.candidates[0]) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    addMessage(aiResponse, false);
                    
                    // Update conversation history
                    conversationHistory.push({ role: "user", content: message });
                    conversationHistory.push({ role: "model", content: aiResponse });
                    
                    // Keep history manageable (last 20 messages)
                    if(conversationHistory.length > 20) {
                        conversationHistory = conversationHistory.slice(-20);
                    }
                    
                    updateStatus('✅ Response received');
                } else {
                    let errorMsg = 'Unknown error';
                    if(data.error) {
                        errorMsg = data.error.message;
                        if(errorMsg.includes('API key not valid')) {
                            errorMsg = 'Invalid API key. Please check your key and try again.';
                            API_KEY = '';
                            localStorage.removeItem('gemini_api_key');
                            document.getElementById('apiKey').value = '';
                        }
                    }
                    addMessage(`Error: ${errorMsg}`, false);
                    updateStatus('❌ Error occurred', 'error');
                }
            } catch(error) {
                typingIndicator.style.display = 'none';
                addMessage(`Network error: ${error.message}`, false);
                updateStatus('❌ Network error - check your connection', 'error');
            } finally {
                // Re-enable input
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }
        
        function clearChat() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = '';
            conversationHistory = [];
            addSystemMessage('Chat cleared! Start a new conversation.');
            updateStatus('🔄 Chat history cleared');
        }
        
        function handleKeyPress(event) {
            if(event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Focus input on load
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
